<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Arrow Puzzle Reviews</title>
  
  <!-- Google Font Rubik -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <div class="header-left">
        <h1>Arrow Puzzle Reviews</h1>
        <span id="reviewCount" class="review-count">0</span>
      </div>

      <div class="header-right">
        <select id="filterSelect" class="filter-select" aria-label="Filter reviews">
          <option value="pending" selected>Pending Reviews</option>
          <option value="marked">Marked Reviews</option>
          <option value="all">All Reviews</option>
        </select>
        <button id="shuffleBtn" class="shuffle-btn" onclick="shuffleCurrentList()" title="Shuffle and randomize current reviews list" aria-label="Shuffle reviews">
          <svg class="shuffle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span>Shuffle</span>
        </button>
      </div>
    </header>

    <div id="reviewsList" class="reviews-list">
      <!-- Cards rendered by app.js -->
    </div>

    <!-- Bottom Controls: Load 10 More & Clear Data -->
    <div class="bottom-controls">
      <div id="loadMoreContainer" class="load-more-container">
        <button id="loadMoreBtn" class="load-more-btn" onclick="loadMore()">
          Load 10 More
        </button>
        <div id="allLoadedNotice" class="all-loaded-notice" style="display: none;">
          All reviews loaded
        </div>
      </div>

      <div class="clear-data-wrapper">
        <button type="button" class="clear-data-link" onclick="clearAllData()" title="Clear saved progress and reset all reviews to pending">
          Reset / Clear Data
        </button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
