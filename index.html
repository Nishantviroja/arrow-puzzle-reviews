<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrow Puzzle Reviews</title>
  
  <!-- Google Font Rubik -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <div class="header-left">
        <h1>Arrow Puzzle Reviews</h1>
        <span id="reviewCount" class="review-count">0</span>
      </div>

      <div class="header-right">
        <select id="filterSelect" class="filter-select">
          <option value="pending" selected>Pending Reviews</option>
          <option value="marked">Marked Reviews</option>
          <option value="all">All Reviews</option>
        </select>
      </div>
    </header>

    <div id="reviewsList" class="reviews-list">
      <!-- Cards rendered by app.js -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
